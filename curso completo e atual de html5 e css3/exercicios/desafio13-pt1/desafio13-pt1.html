<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 350px;
            height: 240px;

        }

        tr.linha { 
            background-color: rgb(0, 21, 128);
        }

        td { 
            border: 1px solid black;
            padding: 8px;
            text-align: center; /* alinhar o texto dos dados da tabela HORIZONTAL*/
            vertical-align: center; /* alinhar o texto dos dados da tabela VERTICALMENTE*/
        }

        .numero {
            text-align: right; /* alinhar os dados (números) para a direita como é no excel*/
        }
    
    </style>
</head>
<body>
    <!--
        HIERARQUIA DE TABELAS (simples)
        TABLE = tabela
            TABLE ROW = linha de tabela
                TABLE HEADER = cabeçalho
                TABLE DATA = dado de tabela
    -->
    <table>
        <tr> <!-- PRIMEIRA LINHA -->
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>
        </tr>
        <tr> <!-- SEGUNDA LINHA -->
            <td>5</td>
            <td>6</td>
            <td>7</td>

        </tr>
        <tr> <!-- TERCEIRA LINHA -->
            <td colspan="3">8</td>
            <td>9</td>
        </tr>
        <tr> <!-- QUARTA LINHA -->
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <td>12</td>
        </tr>
        <tr> <!-- QUINTA LINHA -->
            <td>13</td>
            <td>14</td>
            <td>15</td>
            <!-- P SEGREDO FOI ENTENDER AS TR E AS LINHAS E COLUNAS  -->

        </tr>
    </table>
</body>
</html>
