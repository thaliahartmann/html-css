<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 350px;
            height: 240px;

        }

        tr.linha { 
            background-color: rgb(0, 21, 128);
        }

        td { 
            border: 1px solid black;
            padding: 8px;
            text-align: center; /* alinhar o texto dos dados da tabela HORIZONTAL*/
            vertical-align: center; /* alinhar o texto dos dados da tabela VERTICALMENTE*/
        }

        .numero {
            text-align: right; /* alinhar os dados (números) para a direita como é no excel*/
        }
    
    </style>
</head>
<body>
    <!--
        HIERARQUIA DE TABELAS (simples)
        TABLE = tabela
            TABLE ROW = linha de tabela
                TABLE HEADER = cabeçalho
                TABLE DATA = dado de tabela
    -->
   <table>
    <tr> <!-- PRIMEIRA LINHA -->
        <td colspan="4">A</td>
        <td rowspan="4">B</td>
    </tr>
    <tr> <!-- SEGUNDA LINHA -->
        <td rowspan="4">C</td>
        <td>D</td>
        <td>E</td>
        <td>F</td>
    </tr>
    <tr> <!-- TERCEIRA LINHA -->
        <td>G</td>
        <td>H</td>
        <td>I</td>
    </tr>
    <tr> <!-- QUARTA LINHA -->
        <td>J</td>
        <td>L</td>
        <td>M</td>
    </tr>
    <tr> <!-- QUINTA LINHA -->
        <td colspan="4">N</td>
    </tr>
    </table>
     <!-- P SEGREDO FOI ENTENDER AS TR E AS LINHAS E COLUNAS e ir excluindo os mortos  -->
</body>
</html>
