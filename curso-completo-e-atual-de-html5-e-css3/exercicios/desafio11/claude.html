<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio do astronauta</title>
    <style>

        body {
            margin: 0;
            height: 100vh;

            /* fundo espacial cobrindo tudo */
            background-image: url(imagens/espaco.jpg);
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* centraliza o astronauta */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            max-width: 50%;   /* ocupa metade da tela */
            max-height: 80vh; /* nunca passa da altura da tela */
            object-fit: contain; /* mantém proporção sem cortar */
        }

    </style>
</head>
<body>
    <img src="imagens/astronauta.png" alt="Astronauta flutuando no espaço">
</body>
</html>
