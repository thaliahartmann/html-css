<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        /* ANATOMIA DO FLEX ITEM

        order

        todo item dentro do pai terá order 0
        e o proprio css vai reordenar em ordem crescente se
        voce mesmo ordenar cada item com cada numero diferente




        */

        div.conteiner {
            background-color: lightsalmon;
            display: flex;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            padding: 20px;
        }

        div#i1 {
            order: 0;
        }

        div#i2 {
            order: -2;
        }

        div#i3 {
            order: 4;
        }

        div#i4 {
            order: 8;
        }

        div#i5 {
            order: 2;
        }

        div#i6 {
            order: 0;
        }

        div#i7 {
            order: -4;
        }
             
    </style>
</head>
<body>
    <div class="conteiner"> <!--pai-->
        <div class="item"id="i1">A</div> <!--filho-->
        <div class="item"id="i2">B</div> <!--filho-->
        <div class="item"id="i3">C</div> <!--filho-->
        <div class="item"id="i4">D</div> <!--filho-->
        <div class="item"id="i5">E</div> <!--filho-->
        <div class="item"id="i6">F</div> <!--filho-->
        <div class="item"id="i7">G</div> <!--filho-->
    </div>
</body>
</html>
