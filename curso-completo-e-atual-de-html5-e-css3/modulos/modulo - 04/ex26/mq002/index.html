<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Múltiplas Media Features com CSS (melhor forma de unir css para um projeto grande)</title>
    <!-- Media Query é a mesma coisa que Media type (tipo de midia) + Media Features (característica de midia)-->
    <link rel="stylesheet" href="estilos/style.css" media="all">  <!-- media all vale para todos os tipos de mídia ?-->
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation: portrait)">
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)">
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
    
</body>
</html>
