  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            flex-basis: 150px;
            text-align: center;
        }

        div#cxA {
            flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 200px;
            
            /*flex: 1 0 200px; é uma shorthand recomendada pela w3c*/
        }

        div#cxB {
            flex-shrink: 0;
            flex-grow: 2;
            flex-basis: 150px;

            /* flex: 0 2 150px; é uma shorthand recomendada pela w3c*/
        }

        div#cxC {
            flex-shrink: 2;
            flex-grow: 1;    
            flex-basis: auto;

            /* flex: 2 1 auto; é uma shorthand recomendada pela w3c*/
        }

        
    </style>
</head>
<body>
    <div class="conteiner"> <!--pai-->
        <div class="item" id="cxA">A</div> <!--filho-->
        <div class="item" id="cxB">B</div> <!--filho-->
        <div class="item" id="cxC">C</div> <!--filho-->
    </div>
</body>
</html>
