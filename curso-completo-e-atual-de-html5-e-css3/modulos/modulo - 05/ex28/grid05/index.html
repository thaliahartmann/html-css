<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>

        .container {
            display: grid;
            border: 3px solid rgb(0, 72, 255);

            /*  shorthamd colunas e linhas */
            grid-template-columns: 200px 50% 1fr 1fr;
            grid-template-rows: 80px;
            grid-auto-rows: 80px;
            grid-auto-columns: 150px;
  

            /* espaçamento dos itens*/

            gap: 10px;

            /* shorthands align e justify */

            place-items: normal normal; /* align (vertical) + justify (horizontal) */
            place-content: normal normal; /* align (vertical) + justify (horizontal) */
        }

        .item {
            border: 3px solid red;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div class="container"> 
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
        <div class="item">K</div>
        
    </div>
</body>
</html>
