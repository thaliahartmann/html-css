<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>

        .container {
            display: grid;
            border: 3px solid rgb(0, 72, 255);
            height: 250px; /* altura do container */

            /*  shorthamd colunas e linhas */
            grid-template: repeat(3, auto)/ repeat(3, auto); /* rows e dps columns*/

            /* espaçamento dos itens*/

            gap: 10px;

            /* shorthands align e justify */

            place-items: start center; /* align (vertical) + justify (horizontal) */
            place-content: space-between end; /* align (vertical) + justify (horizontal) */
        }

        .item {
            border: 3px solid red;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div class="container"> 
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        
    </div>
</body>
</html>
